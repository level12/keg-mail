[build-system]
requires = [
    'hatchling',
]
build-backend = 'hatchling.build'


[project]
name = 'Keg-Mail'
description = 'A mail sending library for keg applications'
authors = [
    {name = 'Level 12 Developers', email = 'devteam@level12.io'},
]
requires-python = '>=3.10'
dynamic = ['version']
readme = 'readme.md'
license = 'BSD-3-Clause'
license-files = ['license.txt']
classifiers = [
    'Intended Audience :: Developers',
    'License :: OSI Approved :: BSD License',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3.7',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
]
dependencies = [
    'arrow',
    'flask-mail>=0.10.0',
    'Keg',
    'SQLAlchemy-Utils',
]


[project.urls]
Homepage = 'https://github.com/level12/keg-mail'
Repository = 'https://github.com/level12/keg-mail'


[project.optional-dependencies]
mailgun = [
    'ordered-set',
    'requests',
]
test = [
    'flask-webtest',
    'KegElements',
    'nox',
    'pytest',
    'pytest-cov',
    'requests-mock',
]


[dependency-groups]
dev = [
    {include-group = "pytest"},
    {include-group = "prek"},
    {include-group = "audit"},
    {include-group = "build"},
    {include-group = "nox"},
    'click',
    'ruff==0.16.2',
]
# Used by nox
pytest = [
    'flask-webtest',
    'KegElements',
    'ordered-set',
    'pytest',
    'pytest-cov',
    'requests',
    'requests-mock',
]
# Used by nox
prek = [
    'prek',
]
# Used by nox
audit = [
    'pip-audit',
]
# Used by nox
build = [
    'build',
    'twine',
]
# Used by CI
nox = [
    'nox',
]
